onboarding = false

[terminal]
default_shell = "/usr/bin/fish"
new_cwd = "follow"

[keys]
prefix = "ctrl+a"
help = "prefix+?"
settings = "prefix+s"
reload_config = "prefix+shift+s"
goto = "prefix+f"
open_notification_target = "prefix+o"
toggle_sidebar = "prefix+b"
detach = "prefix+q"
workspace_picker = "prefix+w"
new_workspace = "prefix+shift+w"
rename_workspace = "prefix+alt+w"
close_workspace = "prefix+ctrl+w"
previous_workspace = "prefix+up"
next_workspace = "prefix+down"
switch_workspace = "prefix+shift+1..9"
open_worktree = "prefix+g"
new_worktree = "prefix+shift+g"
remove_worktree = "prefix+ctrl+g"
new_tab = "prefix+shift+t"
rename_tab = "prefix+alt+t"
close_tab = "prefix+ctrl+t"
previous_tab = "prefix+left"
next_tab = "prefix+right"
move_tab_previous = "prefix+shift+left"
move_tab_next = "prefix+shift+right"
switch_tab = "prefix+1..9"
last_pane = "prefix+p"
rename_pane = "prefix+alt+p"
close_pane = "prefix+ctrl+p"
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
swap_pane_left = "prefix+shift+h"
swap_pane_down = "prefix+shift+j"
swap_pane_up = "prefix+shift+k"
swap_pane_right = "prefix+shift+l"
resize_pane_left = "prefix+ctrl+h"
resize_pane_down = "prefix+ctrl+j"
resize_pane_up = "prefix+ctrl+k"
resize_pane_right = "prefix+ctrl+l"
cycle_pane_next = "prefix+tab"
cycle_pane_previous = "prefix+shift+tab"
split_vertical = "prefix+v"
split_horizontal = "prefix+shift+v"
zoom = "prefix+z"
resize_mode = "prefix+r"
copy_mode = "prefix+c"
clear_pane = "prefix+shift+c"
edit_scrollback = "prefix+e"
previous_agent = "prefix+alt+up"
next_agent = "prefix+alt+down"
focus_agent = "prefix+alt+1..9"
remote_image_paste = "ctrl+v"
navigate_workspace_up = "up"
navigate_workspace_down = "down"
navigate_pane_left = "h"
navigate_pane_down = "j"
navigate_pane_up = "k"
navigate_pane_right = "l"

[ui.toast]
delivery = "herdr"

[ui]
status_indicators = "symbols"

[theme]
name = "catppuccin"
auto_switch = false
